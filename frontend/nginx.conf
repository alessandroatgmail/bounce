server {
    listen 80;

    # ── React app ─────────────────────────────────────────────────────────────
    # Serve the built React files.
    # "try_files" is essential for React Router — if the file doesn't exist,
    # fall back to index.html so React can handle the route client-side.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Django API ────────────────────────────────────────────────────────────
    # All requests to /api/* are proxied to the Django container.
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Django Admin ──────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Django static files ───────────────────────────────────────────────────
    # Served directly by Nginx — much faster than going through Django.
    location /static/ {
        alias /django_static/;
    }

    # ── Django media files ────────────────────────────────────────────────────
    location /media/ {
        alias /django_media/;
    }

    # ── WebSocket (Django Channels) ───────────────────────────────────────────
    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}