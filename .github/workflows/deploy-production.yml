name: Deploy to Production

# Trigger: only the main branch reaches production.
on:
  push:
    branches:
      - main

# Prevent two deploys from overlapping. Without this, two merges in
# quick succession can run migrations concurrently on the same database.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Bind to a GitHub Environment so a manual approval can be required
    # before the job runs (Settings > Environments > production).
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail

            cd /home/deploy/bounce
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

            # Record the currently deployed commit so a rollback is one
            # command away. Written BEFORE we change anything.
            git rev-parse HEAD > /home/deploy/last_known_good_commit

            # reset --hard instead of pull: if someone edited a file on
            # the server during an incident, pull fails with a conflict
            # and leaves the deploy half-done. reset makes the server an
            # exact copy of the branch, every time.
            git fetch origin main
            git reset --hard origin/main

            # Build first. If the build fails, nothing has changed yet
            # and the running containers keep serving the old version.
            $COMPOSE build

            # Migrate in a throwaway container created from the NEW image.
            # "run --rm" does not require the old container to be healthy.
            $COMPOSE run --rm web python manage.py migrate --noinput

            # Collect static into the shared named volume
            $COMPOSE run --rm web python manage.py collectstatic --noinput

            # Only now swap the running containers
            $COMPOSE up -d --remove-orphans

            # Remove dangling images from previous builds
            docker image prune -f