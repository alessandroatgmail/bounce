[pytest]
DJANGO_SETTINGS_MODULE = core.settings
pythonpath = .
asyncio_mode = auto

# Test discovery: only look inside tests/
testpaths = tests

# Markers to run subsets:
#   pytest -m unit
#   pytest -m integration
#   pytest -m websocket
markers =
    unit:        Pure logic tests — no DB, no HTTP
    integration: API tests — requires DB and test client
    websocket:   WebSocket / Channels tests — requires channel layer