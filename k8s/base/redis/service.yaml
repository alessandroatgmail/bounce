---
# =============================================================================
# Redis Service
# =============================================================================
# Headless service (clusterIP: None) for StatefulSet stable DNS.
# Other pods connect via: redis:6379
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379