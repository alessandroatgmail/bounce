# =============================================================================
# Celery Worker Deployment
# =============================================================================
# Celery processes async tasks from the Redis queue.
# It shares the same Docker image as Django — just a different command.
# No ports needed: Celery connects OUT to Redis, nothing connects IN to it.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis 6379; do sleep 2; done
              echo "redis ready"
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka-broker 29092; do sleep 2; done
              echo "kafka-broker ready"
      containers:
        - name: celery-worker
          image: bounce_2_0_backend:local
          imagePullPolicy: Never
          command: ["celery", "-A", "core", "worker", "--loglevel=info"]
          envFrom:
            - secretRef:
                name: django-secret
          # Celery does not expose HTTP — use this probe instead:
          # it checks that the worker process is alive by inspecting it.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "celery -A core inspect ping -d celery@$HOSTNAME"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10

---
# =============================================================================
# Kafka Consumer Deployment
# =============================================================================
# Runs the custom management command: python manage.py run_kafka_consumer
# Same image as Django and Celery — different entrypoint.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-consumer
  template:
    metadata:
      labels:
        app: kafka-consumer
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka-broker 29092; do sleep 2; done
              echo "kafka-broker ready"
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do sleep 2; done
              echo "postgres ready"
      containers:
        - name: kafka-consumer
          image: bounce_2_0_backend:local
          imagePullPolicy: Never
          command: ["python", "manage.py", "run_kafka_consumer"]
          envFrom:
            - secretRef:
                name: django-secret
          # The consumer is a long-running process with no HTTP interface.
          # A simple process liveness check is sufficient.
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "run_kafka_consumer"]
            initialDelaySeconds: 20
            periodSeconds: 30