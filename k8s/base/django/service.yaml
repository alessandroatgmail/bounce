# =============================================================================
# Django Service
# =============================================================================
# ClusterIP: only the Ingress controller talks to Django from outside.
# Internal pods (Celery, etc.) use: django:8000
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: django
spec:
  type: ClusterIP
  selector:
    app: django
  ports:
    - port: 8000
      targetPort: 8000