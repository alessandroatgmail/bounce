# =============================================================================
# Zookeeper StatefulSet
# =============================================================================
# Zookeeper manages Kafka broker metadata and leader election.
# It requires stable network identity → StatefulSet.
# Pod name will always be: zookeeper-0
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
spec:
  serviceName: zookeeper
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.1
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          readinessProbe:
            exec:
              # "ruok" is disabled by default in recent Zookeeper versions.
              # "srvr" is the only enabled four-letter command — it returns
              # server stats when Zookeeper is healthy.
              command: ["bash", "-c", "echo srvr | nc localhost 2181 | grep -i mode"]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: zookeeper-data
              mountPath: /var/lib/zookeeper/data
            - name: zookeeper-logs
              mountPath: /var/lib/zookeeper/log
  volumeClaimTemplates:
    - metadata:
        name: zookeeper-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: zookeeper-logs
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

---
# =============================================================================
# Zookeeper Service
# =============================================================================
# "Headless" service (clusterIP: None) for StatefulSet DNS resolution.
# Kafka will connect to zookeeper via: zookeeper:2181
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
spec:
  clusterIP: None          # Headless: returns pod IP directly, no load balancing.
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181