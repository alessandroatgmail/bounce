name: "bounce_2_0"

services:

  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  kafka:
    ports:
      - "9092:9092"

  web:
    ports:
      - "8000:8000"

  # ── Dev-only tools ───────────────────────────────────────────────
  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    entrypoint: >
      sh -c "until nc -z redis 6379;
             do echo 'flower: waiting for redis...'; sleep 2;
             done;
             celery flower --broker=redis://redis:6379/0"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  kafka_ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"